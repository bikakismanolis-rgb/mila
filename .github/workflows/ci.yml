# Σε κάθε push και pull request: χτίζεται το app, και τρέχουν τα tests ασφαλείας
# της βάσης σε μια καθαρή Postgres. Αν κάτι από αυτά κοκκινίσει, η αλλαγή δεν
# πρέπει να φτάσει στους χρήστες.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:push

  database:
    name: Database security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Ίδια μεγάλη έκδοση με τη Supabase.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:db
